name: Deploy

# GitHub Actions orchestrates; the work runs on the self-hosted runner installed on
# the deployment host itself (label: nascon). That runner is the production machine,
# so the pipeline builds the images locally and restarts the stack in place — no
# registry round trip, no SSH, and docker layer caching between deploys.
#
# Why self-hosted: this account is refused GitHub-hosted runners. Every job — even a
# single `uname -a` — is aborted with runner_id 0 and no steps, on every workflow.
# Self-hosted runners are unaffected.
#
# The application's secrets live only in /opt/nascon/.env on the host. They never
# travel through CI. See deploy/README.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_ENV_FILE: /opt/nascon/.env
  DOMAIN: nascon.artdevelopers.site

jobs:
  deploy:
    name: Build and roll out
    runs-on: [self-hosted, nascon]
    steps:
      - uses: actions/checkout@v4

      - name: Check the production configuration
        run: |
          set -euo pipefail
          if [ ! -f "$APP_ENV_FILE" ]; then
            echo "::error::$APP_ENV_FILE is missing. Copy deploy/.env.example there and fill it in."
            exit 1
          fi
          echo "using $APP_ENV_FILE"
          grep -cE '^[A-Z]' "$APP_ENV_FILE" | xargs -I{} echo "  {} variables set"

      - name: Build the images
        run: |
          set -euo pipefail
          # Tagged with the commit so a rollback is just a different tag.
          export IMAGE_TAG="${GITHUB_SHA::12}"
          echo "IMAGE_TAG=$IMAGE_TAG" >>"$GITHUB_ENV"
          docker compose --env-file "$APP_ENV_FILE" build

      - name: Roll the stack
        run: |
          set -euo pipefail
          docker compose --env-file "$APP_ENV_FILE" up -d --remove-orphans
          docker compose --env-file "$APP_ENV_FILE" ps
          docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true

      - name: Verify the running stack
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          echo "== containers =="
          docker compose --env-file "$APP_ENV_FILE" ps --format 'table {{.Name}}\t{{.Status}}'

          unhealthy=$(docker compose --env-file "$APP_ENV_FILE" ps --format '{{.Status}}' \
            | grep -cE 'Restarting|unhealthy|Exit' || true)
          [ "$unhealthy" = "0" ] || fail "$unhealthy container(s) are not healthy"

          echo
          echo "== through the public domain =="
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$DOMAIN/api/health" || true)
            [ "$code" = "200" ] && break
            echo "  attempt $attempt: /api/health -> $code"
            [ "$attempt" = "24" ] && fail "the API never answered on $DOMAIN"
            sleep 10
          done

          curl -fsS --max-time 20 "https://$DOMAIN/" | grep -q 'id="root"' \
            || fail "the SPA shell was not served"

          curl -fsS --max-time 20 "https://$DOMAIN/api/health" >/tmp/nascon-api.json
          grep -q '"status":"ok"' /tmp/nascon-api.json || fail "the API is not healthy"

          echo
          echo "== voice and the audio queue =="
          curl -fsS --max-time 30 "https://$DOMAIN/voice/health" >/tmp/nascon-voice.json
          python3 - <<'PY'
          import json, sys

          data = json.load(open("/tmp/nascon-voice.json"))
          queue = data.get("queue", {})

          print("stt   :", data["stt"]["model"], "configured:", data["stt"]["configured"])
          print("tts   :", data["tts"]["voice"], "edge_tts:", data["tts"]["edge_tts"])
          print("queue :", queue.get("queue"), "worker:", queue.get("worker_alive"),
                "broker:", queue.get("reason"), "spool:", queue.get("spool_files"))

          problems = []
          if not data["stt"]["configured"]:
              problems.append("speech-to-text is not configured")
          if not queue.get("worker_alive"):
              problems.append("the audio queue worker is not running")
          if problems:
              print("::error::" + "; ".join(problems))
              sys.exit(1)
          print("voice path healthy")
          PY

          echo
          echo "deployed ${GITHUB_SHA}"

      - name: Latest logs when it fails
        if: failure()
        run: |
          echo "::warning::Investigate on the host:"
          echo "  cd /opt/nascon && docker compose --env-file .env ps"
          echo "  docker compose --env-file /opt/nascon/.env logs --tail=60"
          echo "Roll back with:"
          echo "  cd /opt/nascon && IMAGE_TAG=<previous-tag> docker compose --env-file .env up -d"
          echo
          docker compose --env-file "$APP_ENV_FILE" logs --tail=40 || true
